name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm curl linux-tools-generic
          # The /usr/bin/bpftool wrapper demands a per-kernel package absent on
          # CI cloud kernels; use the real binary bundled with linux-tools-generic.
          BPFTOOL="$(ls /usr/lib/linux-tools-*/bpftool | head -1)"
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"
          "$BPFTOOL" version
      - name: Resolve dependencies
        run: go mod tidy
      - name: Generate eBPF bindings
        run: make generate BPFTOOL="$BPFTOOL"
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./internal/...
      - name: Coverage summary
        run: go tool cover -func=coverage.out

  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # eBPF codegen needs kernel BTF, unavailable inside a buildx/QEMU build,
      # so generate the (arch-independent, little-endian) object here on the
      # runner and let the image build just cross-compile the Go binary.
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm curl linux-tools-generic
          BPFTOOL="$(ls /usr/lib/linux-tools-*/bpftool | head -1)"
          echo "BPFTOOL=$BPFTOOL" >> "$GITHUB_ENV"
      - name: Resolve dependencies
        run: go mod tidy
      - name: Generate eBPF bindings
        run: make generate BPFTOOL="$BPFTOOL"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
