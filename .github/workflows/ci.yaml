name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install eBPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm curl linux-tools-common linux-tools-generic
      - name: Resolve dependencies
        run: go mod tidy
      - name: Generate eBPF bindings
        run: make generate
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./internal/...
      - name: Coverage summary
        run: go tool cover -func=coverage.out
