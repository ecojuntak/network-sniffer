apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-sniffer-collector
  namespace: default
# The collector never talks to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-sniffer-collector
  namespace: default
  labels:
    app.kubernetes.io/name: network-sniffer
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-sniffer
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-sniffer
        app.kubernetes.io/component: collector
    spec:
      serviceAccountName: network-sniffer-collector
      automountServiceAccountToken: false
      # Share the host PID namespace so the connecting PID's /proc/<pid>/cgroup
      # resolves to its pod UID. hostNetwork keeps the collector off the pod
      # network's failure modes; ClusterFirstWithHostNet still resolves the
      # processor Service name.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      # Run on every node, including tainted and control-plane ones: the
      # processor drops the accepted-side half of in-cluster calls on the
      # assumption that the caller's node reports the outbound half.
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          image: ecojuntak/network-sniffer:v1.6.1
          imagePullPolicy: IfNotPresent
          args:
            - "collector"
            - "-processor-addr"
            - "network-sniffer-processor.default.svc:9000"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # No cluster cache lives here anymore; the heap only holds the
            # aggregation window and the bounded send queue.
            - name: GOMEMLIMIT
              value: "200MiB"
          ports:
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            # eBPF tracepoint + ring buffer on kernels >= 5.8 need BPF+PERFMON;
            # SYS_RESOURCE covers the memlock rlimit. Fall back to
            # `privileged: true` on older kernels that lack CAP_BPF.
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "SYS_RESOURCE"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            # CO-RE reads kernel BTF at runtime.
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            # Tracepoint attach reads the tracepoint id from tracefs.
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
