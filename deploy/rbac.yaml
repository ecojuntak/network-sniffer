apiVersion: v1
kind: ServiceAccount
metadata:
  name: network-sniffer
  namespace: canary-prober
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: network-sniffer
rules:
  # Read-only cluster-wide watch to map pod IPs to their owning workload.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Map node InternalIPs to a Node identity so host-network / node-level source
  # traffic resolves to the node name instead of a bare IP.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Resolve Istio ServiceEntry VIPs (incl. auto-allocated 240.240.0.0/16) to
  # their external host. Only exercised when istio.enabled is set in config;
  # inert (and harmless) on clusters without the Istio CRD.
  - apiGroups: ["networking.istio.io"]
    resources: ["serviceentries"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: network-sniffer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: network-sniffer
subjects:
  - kind: ServiceAccount
    name: network-sniffer
    namespace: canary-prober
