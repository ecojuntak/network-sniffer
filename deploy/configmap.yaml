apiVersion: v1
kind: ConfigMap
metadata:
  name: network-sniffer
  namespace: default
data:
  config.yaml: |
    # Istio ServiceEntry resolution: maps ServiceEntry VIPs (including istiod's
    # auto-allocated 240.240.0.0/16 addresses) to their external host name, so
    # external dependencies (e.g. RDS via a ServiceEntry) show a name instead
    # of a bare IP. Disabled by default; enable only on Istio clusters (needs
    # the serviceentries RBAC in rbac.yaml). Requires istiod to expose the
    # allocated IPs in the ServiceEntry spec.addresses or status.addresses.
    istio:
      enabled: true
      # apiVersion: v1beta1   # override the ServiceEntry API version if needed

    # Workloads to exclude from the dependency map at emit time.
    # Format: "<namespace>/<workload>", each segment a glob:
    #   "*"          matches a whole segment (including an empty one)
    #   "vmagent-*"  matches a prefix
    #   ""           (empty segment) matches only the empty namespace
    # "*/*" is rejected. An edge is dropped when EITHER endpoint matches.
    #
    # Node-level and external peers have an EMPTY namespace in this tool:
    #   - Node identities are named "ip-<...>" (kubelet health probes, node
    #     daemons) -> match with "/ip-*"
    #   - External IP peers are named by their IP -> match with "*/10.*" etc.
    ignore:
      # kubelet / node-sourced probe traffic (e.g. Istio 15021 readiness)
      - "/ip-*"
      # cluster infrastructure namespaces
      - "kube-system/*"
      - "kube-public/*"
      - "kube-node-lease/*"
      - "istio-system/*"
      - "*/istiod"
      - "monitoring/*"
      - "*/vmagent-*"
      - "amazon-guardduty/*"
      - "castai-agent/*"
      - "metrics/*"
      - "/100.*"
      - "wiz/*"
      - "tracing/*"
      # external / private IP peers (empty namespace, named by IP)
      - "*/10.*"
      - "*/172.1*"
      - "*/172.2*"
      - "*/169.254.*"
      - "*/127.*"
