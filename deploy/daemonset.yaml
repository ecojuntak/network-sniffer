apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: network-sniffer
  namespace: default
  labels:
    app.kubernetes.io/name: network-sniffer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: network-sniffer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-sniffer
    spec:
      serviceAccountName: network-sniffer
      # See the node's connections directly and share the host PID namespace so
      # process (comm/pid) context is meaningful.
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: ip-172-23-94-237.eu-west-1.compute.internal
      # Run on every node, including control-plane.
      containers:
        - name: sniffer
          image: ecojuntak/network-sniffer:v1.6.1
          imagePullPolicy: IfNotPresent
          # Ignore-list config, mounted from the network-sniffer ConfigMap.
          args:
            - "-config"
            - "/etc/network-sniffer/config.yaml"
          env:
            # Soft heap ceiling for the Go GC. Set below the 1Gi container limit
            # (leaving headroom for BPF maps, goroutine stacks and off-heap
            # allocations) so the GC collects harder as the heap approaches it,
            # rather than the kernel OOM-killing the pod. Belt-and-suspenders
            # alongside the informer WithTransform trimming.
            - name: GOMEMLIMIT
              value: "850MiB"
          securityContext:
            # eBPF tracepoint + ring buffer on kernels >= 5.8 need BPF+PERFMON;
            # SYS_RESOURCE covers the memlock rlimit. Fall back to
            # `privileged: true` on older kernels that lack CAP_BPF.
            privileged: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "SYS_RESOURCE"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 1Gi
          volumeMounts:
            # CO-RE reads kernel BTF at runtime.
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            # Tracepoint attach reads the tracepoint id from tracefs.
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            # Ignore-list configuration.
            - name: config
              mountPath: /etc/network-sniffer
              readOnly: true
      volumes:
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: config
          configMap:
            name: network-sniffer
